error_log logs/error.log;
access_log logs/access.log;

error_page 400 error_pages/global/400.html;
error_page 403 error_pages/global/403.html;
error_page 404 error_pages/global/404.html;
error_page 405 error_pages/global/405.html;
error_page 500 error_pages/global/500.html;

server {
    listen 1312;
    server_name localhost;
    root www/dynamic_website/;
    index index.php index.html;

    location / {
        allow_methods GET;
    }

    location /put_test/* {
        allow_methods PUT;
        root /path/to/your/put_uploads/; # <-- Set your uploads directory here
    }

    location ~ \.bla$ {
        allow_methods POST;
        cgi_pass /path/to/cgi_test; # <-- Path to your cgi_test executable
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    location /directory/ {
        allow_methods GET;
        root /path/to/YoupiBanane/; # <-- Path to YoupiBanane repo
        index youpi.bad_extension;
        autoindex on;
    }
}
