# Global configuration
error_log boudin.log;
# access_log bouilloire.log;

# error_page 400 error_pages/global/400.html;
# error_page 403 error_pages/global/403.html;
# error_page 404 error_pages/global/cacahuetes.html;
# error_page 405 error_pages/global/405.html;
# error_page 500 error_pages/global/500.html;

client_max_body_size 10M;

server {
	listen 8081 8084;
	server_name localhost 127.0.1.1;
	root www/hannah_montana/;
	index salut.html index.php					; 	
	client_max_body_size 1M;
	
	error_page 400 error_pages/400.html;
	error_page 403 error_pages/403.html;
	error_page 404 error_pages/404.html;
	error_page 405 error_pages/405.html;
	error_page 415 error_pages/415.html;
	error_page 500 error_pages/500.html;

	location /lolilol {
		allow_methods	DELETE POST						 GET		;		
		autoindex off;
	}

	location /pages/errors {
		allow_methods GET;
		index errors.php;
	}

	location /pages/post {
		allow_methods GET;
		index post.php;
	}
}

server {
	listen 8082;
	server_name localhost;
	root www/static_website/;
	index index.php index.html;
	client_max_body_size 1M;

	location / {
		allow_methods  DELETE POST GET;
		autoindex off;
	}
}

server {
	listen 8083;
	server_name localhost;
	root www/python_website/;
	index index.py index.html;
	client_max_body_size 1M;

	location / {
		allow_methods  DELETE POST GET;
		autoindex off;
	}
}
